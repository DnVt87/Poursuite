# eSAJ Full Inventory — sample TJSP process numbers.
#
# Each entry:
#   number:           CNJ-formatted process number
#   source:           "operator" (provided by user)
#                     "gap-filler" (added by Claude Code to fill an archetype gap)
#                     "candidate" (added to expand class/section diversity beyond the 10 archetypes)
#   target_archetype: declared archetype this case is expected to represent.
#                     The walker captures empirical observations per case in Section 2 of
#                     the report so the operator can verify whether the case actually fits.
#                     The Archetype coverage check in the report uses these declarations
#                     directly (no auto-classification — see ARCHITECTURE.md §10.4).
#
# Conceptual archetypes (eSAJ inventory test set):
#   1. Execução de título extrajudicial
#   2. Cumprimento de sentença
#   3. Execução fiscal
#   4. Multi-party (>2 polos)
#   5. Sealed (segredo de justiça)
#   6. Migrated/legacy (pre-2010)
#   7. Recent case still in citação phase
#   8. Case with active penhora movimento
#   9. Case with embargos à execução / linked processes
#  10. High-volume movimentações (>200 movimentos)

