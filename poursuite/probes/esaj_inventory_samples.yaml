# ----- Unfilled archetypes (sourcing notes) -----
#
# The following 3 archetypes could not be sourced as public TJSP cases by
# Claude Code via web search:
#
#   - Cumprimento de sentença
#   - Execução fiscal
#   - Sealed (segredo de justiça)
#
# Difficulty:
#   - JusBrasil (the largest public Brazilian case-law index) consistently
#     redacts the first 7 digits of CNJ process numbers (`XXXXX-DD.YYYY.8.26.OOOO`),
#     making it impossible to construct a valid lookup number from search results.
#   - TJSP press releases reference cases without quoting full CNJ numbers.
#   - Sealed (segredo de justiça) cases are sealed BY DESIGN — public examples
#     are not findable without operator/lawyer prior knowledge.
#
# Recommended operator follow-up: provide one known case number per missing
# archetype if available; otherwise the inventory proceeds without these
# specific archetypes filled. Field/section findings from the existing 13
# cases already cover the structural patterns.
